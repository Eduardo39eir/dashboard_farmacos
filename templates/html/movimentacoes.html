<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movimentações</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        /* Estilos básicos para o alerta de mensagem funcionar visualmente */
        .alert {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: bold;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
    </style>

</head>


<body class="dashboard-layout">

    <button class="menu-toggle" id="menuToggle">☰</button>


    <header>

        <img src="/static/images/logo_unesp.png" alt="UNESP">

        <a href="dashboard.html" class="nav-link">
            Dashboard
        </a>

        <a href="estoque.html" class="nav-link">
            Estoque (Lotes)
        </a>

        <a href="movimentacoes.html" class="nav-link active-page">
            Movimentações
        </a>

        <a href="farmacos.html" class="nav-link">
            Fármacos
        </a>

        <a href="fornecedores.html" class="nav-link">
            Fornecedores
        </a>

        <button class="sair" onclick="fazer_logout()">
            Sair
        </button>

    </header>


    <div class="content-wrapper">

        <main>

            <div class="page-header">

                <h1>Movimentações</h1>

                <button
                    class="btn btn-primary"
                    onclick="prepararModalMovimentacao(); openModal('modal-movimentacao')">

                    + Nova Movimentação

                </button>

            </div>


            <div id="mensagem"></div>


            <div class="table-responsive">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Fármaco</th>

                            <th>Lote</th>

                            <th>Tipo</th>

                            <th>Quantidade</th>

                            <th>Usuário</th>

                            <th>Data/Hora</th>

                            <th>Observação</th>

                            <th>Ações</th>

                        </tr>

                    </thead>


                    <tbody id="tabela-movimentacoes"></tbody>

                </table>

            </div>

        </main>


        <footer>
            Medicina Nuclear UNESP | Desenvolvido por SESI
        </footer>

    </div>


    <!-- Modal de Movimentação -->
    <div
        id="modal-movimentacao"
        class="modal-overlay hidden">

        <div class="modal-card">

            <h3 id="titulo-modal-movimentacao">
                Nova Movimentação
            </h3>


            <input
                type="hidden"
                id="in-mov-id">


            <div
                class="input-group"
                style="margin-top: 15px;">

                <label>Lote</label>

                <select id="sel-mov-lote">

                    <option value="">
                        Selecione um lote...
                    </option>

                </select>

            </div>


            <div class="input-group">

                <label>Tipo de Movimentação</label>

                <select id="sel-mov-tipo">

                    <option value="">
                        Selecione...
                    </option>

                    <option value="entrada">
                        Entrada
                    </option>

                    <option value="saida">
                        Saída
                    </option>

                </select>

            </div>


            <div class="input-group">

                <label>Quantidade</label>

                <input
                    type="number"
                    id="in-mov-quantidade"
                    min="1"
                    placeholder="Ex: 10">

            </div>


            <div class="input-group">

                <label>Observação</label>

                <textarea
                    id="in-mov-observacao"
                    rows="4"
                    placeholder="Digite uma observação, se necessário"></textarea>

            </div>


            <div style="text-align: right; margin-top: 20px;">

                <button
                    class="btn btn-outline"
                    onclick="cancelarMovimentacao()">

                    Cancelar

                </button>


                <button
                    class="btn btn-primary"
                    id="btn-save-mov"
                    onclick="salvar_movimentacao()">

                    Salvar Movimentação

                </button>

            </div>

        </div>

    </div>


    <script>

        function openModal(modalId) {

            document
                .getElementById(modalId)
                .classList.remove('hidden');

        }


        function closeModals() {

            const modals =
                document.querySelectorAll('.modal-overlay');

            modals.forEach(
                modal => modal.classList.add('hidden')
            );

        }


        // Fechar modal ao clicar fora dele
        window.onclick = function (event) {

            if (
                event.target.classList.contains(
                    'modal-overlay'
                )
            ) {

                closeModals();

            }

        }


        // Menu Mobile
        const menuToggle =
            document.getElementById('menuToggle');

        const header =
            document.querySelector('header');


        if (menuToggle && header) {

            menuToggle.addEventListener(
                'click',
                (e) => {

                    e.stopPropagation();

                    header.classList.toggle('open');

                }
            );


            // Fecha o menu ao clicar fora dele no mobile
            document.addEventListener(
                'click',
                (e) => {

                    if (
                        header.classList.contains('open')
                        &&
                        !header.contains(e.target)
                        &&
                        e.target !== menuToggle
                    ) {

                        header.classList.remove('open');

                    }

                }
            );

        }

    </script>


    <script src="/static/js/utils.js"></script>
    <script src="/static/js/movimentacoes.js"></script>
    <script src="/static/js/dashboard.js"></script>

</body>

</html>
