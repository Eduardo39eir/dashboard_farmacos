<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Fármacos</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css">

    <style>

        .alert {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: bold;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

    </style>

</head>


<body class="dashboard-layout">

    <button
        class="menu-toggle"
        id="menuToggle">
        ☰
    </button>


    <header>

        <img
            src="/static/images/logo_unesp.png"
            alt="UNESP">


        <a
            href="dashboard.html"
            class="nav-link">

            Dashboard

        </a>


        <a
            href="estoque.html"
            class="nav-link">

            Estoque (Lotes)

        </a>


        <a
            href="movimentacoes.html"
            class="nav-link">

            Movimentações

        </a>


        <a
            href="farmacos.html"
            class="nav-link active-page">

            Fármacos

        </a>


        <a
            href="fornecedores.html"
            class="nav-link">

            Fornecedores

        </a>


        <button
            class="sair"
            onclick="fazer_logout()">

            Sair

        </button>

    </header>


    <div class="content-wrapper">

        <main>


            <div class="page-header">

                <h1>
                    Fármacos
                </h1>


                <button
                    class="btn btn-primary"
                    onclick="prepararModalFarmaco(); openModal('modal-farmaco')">

                    + Novo Fármaco

                </button>

            </div>


            <div id="mensagem"></div>


            <div class="table-responsive">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Nome</th>

                            <th>ID Fornecedor</th>

                            <th>Fornecedor</th>

                            <th>Status</th>

                            <th>Ações</th>

                        </tr>

                    </thead>


                    <tbody id="tabela-farmacos"></tbody>

                </table>

            </div>

        </main>


        <footer>

            Medicina Nuclear UNESP | Desenvolvido por SESI

        </footer>

    </div>


    <!-- Modal Fármaco -->
    <div
        id="modal-farmaco"
        class="modal-overlay hidden">


        <div class="modal-card">


            <h3 id="titulo-modal-farmaco">

                Novo Fármaco

            </h3>


            <input
                type="hidden"
                id="in-farm-id">


            <div
                class="input-group"
                style="margin-top: 15px;">


                <label>
                    Nome do Fármaco
                </label>


                <input
                    type="text"
                    id="in-farm-nome"
                    placeholder="Ex: Glicose (18F)">

            </div>


            <div class="input-group">


                <label>
                    Fornecedor
                </label>


                <select id="sel-farm-forn">

                    <option value="">

                        Selecione o fornecedor...

                    </option>

                </select>

            </div>


            <div
                style="
                    text-align: right;
                    margin-top: 20px;
                ">


                <button
                    class="btn btn-outline"
                    onclick="cancelarFarmaco()">

                    Cancelar

                </button>


                <button
                    class="btn btn-primary"
                    id="btn-save-farm"
                    onclick="salvar_farmaco()">

                    Salvar Fármaco

                </button>

            </div>

        </div>

    </div>


    <script>

        function openModal(modalId) {

            document
                .getElementById(modalId)
                .classList
                .remove('hidden');

        }


        function closeModals() {

            const modals =
                document.querySelectorAll(
                    '.modal-overlay'
                );


            modals.forEach(
                modal =>
                    modal.classList.add(
                        'hidden'
                    )
            );

        }


        // Fechar modal ao clicar fora dele
        window.onclick = function (event) {

            if (
                event.target.classList.contains(
                    'modal-overlay'
                )
            ) {

                closeModals();

            }

        }


        //Menu Mobile
        const menuToggle =
            document.getElementById(
                'menuToggle'
            );


        const header =
            document.querySelector(
                'header'
            );


        if (
            menuToggle &&
            header
        ) {


            menuToggle.addEventListener(
                'click',
                (e) => {

                    e.stopPropagation();

                    header.classList.toggle(
                        'open'
                    );

                }
            );


            // Fecha o menu ao clicar fora dele no mobile
            document.addEventListener(
                'click',
                (e) => {


                    if (
                        header.classList.contains(
                            'open'
                        )
                        &&
                        !header.contains(
                            e.target
                        )
                        &&
                        e.target !== menuToggle
                    ) {

                        header.classList.remove(
                            'open'
                        );

                    }

                }
            );

        }

    </script>


    <script src="/static/js/utils.js"></script>
    <script src="/static/js/farmacos.js"></script>

    <script src="/static/js/dashboard.js"></script>


</body>

</html>
